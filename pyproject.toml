[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musicbox"
version = "0.1.0"
description = "Tap an NFC card, hear a song. A Toniebox-style player for Raspberry Pi."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Hardware driver; only installable/usable on the Pi itself. Blinka needs
# gpiod on a Raspberry Pi but does not declare it.
pi = ["adafruit-circuitpython-pn532>=2.4", "gpiod>=2.2.2,<3", "pyserial>=3.5"]
dev = ["pytest"]

[project.scripts]
musicbox = "musicbox.cli:main"

[tool.setuptools]
packages = ["musicbox"]

[tool.setuptools.package-data]
musicbox = ["static/*", "static/vendor/*", "static/components/*", "sounds/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
