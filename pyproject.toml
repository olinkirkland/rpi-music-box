[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "musicbox"
version = "0.1.0"
description = "Tap an NFC card, hear a song. A Toniebox-style player for Raspberry Pi."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Hardware driver; only installable/usable on the Pi itself.
pi = ["adafruit-circuitpython-pn532>=2.4"]
dev = ["pytest"]

[project.scripts]
musicbox = "musicbox.cli:main"

[tool.setuptools]
packages = ["musicbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
