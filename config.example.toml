# Copy to ~/.config/musicbox/config.toml and edit. Every key is optional;
# the values below are the defaults.

# Where the hard drive with the music is mounted.
music_dir = "/mnt/music"

# Card -> track mapping, maintained by `musicbox assign`.
cards_file = "~/.config/musicbox/cards.json"

# Playback volume, 0-100.
volume = 100

# ALSA device for mpv, e.g. "alsa/plughw:CARD=Device,DEV=0".
# Run `mpv --audio-device=help` to list them. Empty = system default.
audio_device = ""

# The sound card's own hardware volume, 0-100. When set (not -1), it is set
# and read back before every sound and re-checked while playing; if it can't
# be confirmed at or below this value, nothing plays. Needs an audio_device
# with CARD=... in it. mpv's `volume` above is steep below 50 or so, so use
# this for the overall loudness.
mixer_volume = -1

# Sound effects, all scaled to chime_volume (0-100, of each file's own
# loudness). Empty uses the sound bundled with the app (musicbox/sounds);
# a path uses your own file (any format ffmpeg reads).
#   chime_file         when a card is placed, before its tracks. Required:
#                      a song only ever plays after it.
#   remove_chime_file  when a card is lifted ("off" for silence)
#   assign_chime_file  when the Assign window reads a card ("off" for silence)
chime_file = ""
remove_chime_file = ""
assign_chime_file = ""
chime_volume = 25

# Stop each song after this many seconds. 0 plays the whole song.
play_seconds = 0

# How many failed reads in a row count as "card removed". Raise this if
# playback cuts out while the card is still lying on the reader.
misses_to_remove = 3

# Leave empty if the PN532 is wired to the Pi's I2C pins. If it is plugged in
# through a USB serial adapter, set its path; the /dev/serial/by-id/ name stays
# the same across reboots and replugs, unlike /dev/ttyUSB0.
serial_port = ""

# Seconds to wait for a card on each read.
read_timeout = 0.2

# Log of card taps, shown on the web page.
taps_file = "~/.local/share/musicbox/taps.db"

# The web page, at http://<hostname>.local/ (e.g. http://berry.local/) or
# http://<pi-address>/. Port 80 works under the systemd service, which is
# allowed to use it; running `musicbox run` by hand needs a port above 1023.
web_enabled = true
web_port = 80
